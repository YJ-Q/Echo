<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
  <title>Margin 的产品类别边界 / Margin category boundary</title>
  <desc>Margin 位于通用聊天、任务管理、治疗替代和语音助手四类产品之外，以陪伴连续性为中心。Margin sits outside four adjacent categories and centers continuity of companionship.</desc>
  <rect width="1600" height="900" fill="#F4EEDF"/>
  <rect x="54" y="56" width="6" height="788" fill="#A74735"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="105" fill="#A74735" font-size="20" letter-spacing="3">CATEGORY BOUNDARY · 01</text>
    <text x="96" y="157" fill="#25211C" font-family="Georgia, Songti SC, serif" font-size="38">不是另一种助手，而是另一种关系</text>
    <text x="96" y="198" fill="#6E6257" font-size="21">Not another assistant, but another kind of relationship.</text>
  </g>
  <g fill="none" stroke="#CFC2B2" stroke-width="3">
    <path d="M800 320V292"/>
    <path d="M1070 465H1192"/>
    <path d="M800 654V704"/>
    <path d="M530 465H408"/>
  </g>
  <g fill="#CFC2B2">
    <circle cx="800" cy="292" r="6"/>
    <circle cx="1192" cy="465" r="6"/>
    <circle cx="800" cy="704" r="6"/>
    <circle cx="408" cy="465" r="6"/>
  </g>
  <rect x="530" y="320" width="540" height="334" rx="4" fill="#FBF8F0" stroke="#A74735" stroke-width="4"/>
  <text x="800" y="420" text-anchor="middle" fill="#25211C" font-family="Georgia, Songti SC, serif" font-size="64">Margin</text>
  <text x="800" y="478" text-anchor="middle" fill="#A74735" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="31">第二自我式陪伴空间</text>
  <text x="800" y="518" text-anchor="middle" fill="#6E6257" font-family="Segoe UI, sans-serif" font-size="22">A second-self companion space</text>
  <line x1="667" y1="548" x2="933" y2="548" stroke="#D6CABB" stroke-width="2"/>
  <text x="800" y="590" text-anchor="middle" fill="#25211C" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24">保留仍然鲜活的线，再从痕迹继续</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="800" y="244" fill="#25211C" font-size="28">通用聊天 · General chat</text>
    <text x="800" y="275" fill="#6E6257" font-size="19">回答 ≠ 保留连续性</text>
    <text x="1362" y="430" fill="#25211C" font-size="28">任务管理</text>
    <text x="1362" y="463" fill="#6E6257" font-size="19">Task management</text>
    <text x="1362" y="496" fill="#6E6257" font-size="19">继续 ≠ 管理</text>
    <text x="800" y="755" fill="#25211C" font-size="28">治疗替代 · Therapy substitute</text>
    <text x="800" y="788" fill="#6E6257" font-size="19">反思 ≠ 诊断</text>
    <text x="238" y="430" fill="#25211C" font-size="28">语音助手</text>
    <text x="238" y="463" fill="#6E6257" font-size="19">Voice assistant</text>
    <text x="238" y="496" fill="#6E6257" font-size="19">朗读 ≠ 语音人格</text>
  </g>
  <text x="1498" y="822" text-anchor="end" fill="#8D8175" font-family="Segoe UI, sans-serif" font-size="17">POSITIONING, NOT FEATURE COMPARISON</text>
</svg>
