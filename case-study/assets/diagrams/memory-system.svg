<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
  <title>Margin 的状态聚合与选择性记忆系统 / Margin state aggregation and selective memory</title>
  <desc>对话输入经过状态聚合，并参考五层选择性记忆，输出当前线索、一个下一步和解释性信息。Conversation is aggregated against five memory layers to produce a focused, explainable response.</desc>
  <defs>
    <marker id="arrow-memory" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#A74735"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F4EEDF"/>
  <rect x="54" y="56" width="6" height="788" fill="#A74735"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="105" fill="#A74735" font-size="20" letter-spacing="3">MEMORY SYSTEM · 03</text>
    <text x="96" y="157" fill="#25211C" font-family="Georgia, Songti SC, serif" font-size="38">记忆不是仓库，而是一种克制的选择</text>
    <text x="96" y="198" fill="#6E6257" font-size="21">Memory is a selective interface for continuity, not a transcript archive.</text>
  </g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="92" y="367" width="230" height="164" rx="4" fill="#FBF8F0" stroke="#CFC2B2" stroke-width="3"/>
    <text x="207" y="434" text-anchor="middle" fill="#25211C" font-size="31">对话输入</text>
    <text x="207" y="472" text-anchor="middle" fill="#6E6257" font-size="19">CONVERSATION</text>
    <text x="207" y="505" text-anchor="middle" fill="#6E6257" font-size="18">当下表达与语境</text>
    <path d="M322 449H438" fill="none" stroke="#A74735" stroke-width="5" marker-end="url(#arrow-memory)"/>
    <rect x="450" y="318" width="292" height="262" rx="4" fill="#25211C"/>
    <text x="596" y="420" text-anchor="middle" fill="#F4EEDF" font-size="37">状态聚合</text>
    <text x="596" y="461" text-anchor="middle" fill="#D6CABB" font-size="20">STATE AGGREGATION</text>
    <line x1="510" y1="492" x2="682" y2="492" stroke="#A74735" stroke-width="3"/>
    <text x="596" y="531" text-anchor="middle" fill="#D6CABB" font-size="20">什么仍然鲜活？</text>
    <path d="M742 449H795" fill="none" stroke="#A74735" stroke-width="5" marker-end="url(#arrow-memory)"/>
    <text x="948" y="259" text-anchor="middle" fill="#6E6257" font-size="18" letter-spacing="2">SELECTIVE MEMORY · 五层选择性记忆</text>
    <g fill="#FBF8F0" stroke="#CFC2B2" stroke-width="2">
      <rect x="807" y="278" width="282" height="70" rx="2"/>
      <rect x="807" y="362" width="282" height="70" rx="2"/>
      <rect x="807" y="446" width="282" height="70" rx="2"/>
      <rect x="807" y="530" width="282" height="70" rx="2"/>
      <rect x="807" y="614" width="282" height="70" rx="2"/>
    </g>
    <g text-anchor="middle">
      <text x="948" y="308" fill="#25211C" font-size="23">近期上下文</text><text x="948" y="334" fill="#6E6257" font-size="17">RECENT CONTEXT</text>
      <text x="948" y="392" fill="#25211C" font-size="23">记忆笔记</text><text x="948" y="418" fill="#6E6257" font-size="17">MEMORY NOTES</text>
      <text x="948" y="476" fill="#25211C" font-size="23">洞察</text><text x="948" y="502" fill="#6E6257" font-size="17">INSIGHTS</text>
      <text x="948" y="560" fill="#25211C" font-size="23">长期画像</text><text x="948" y="586" fill="#6E6257" font-size="17">LONG-TERM PROFILE</text>
      <text x="948" y="644" fill="#25211C" font-size="23">人工校准</text><text x="948" y="670" fill="#6E6257" font-size="17">HUMAN CALIBRATION</text>
    </g>
    <path d="M1089 449H1173" fill="none" stroke="#A74735" stroke-width="5" marker-end="url(#arrow-memory)"/>
    <g fill="#FBF8F0" stroke="#A74735" stroke-width="3">
      <rect x="1185" y="294" width="318" height="112" rx="4"/>
      <rect x="1185" y="430" width="318" height="112" rx="4"/>
      <rect x="1185" y="566" width="318" height="112" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="1344" y="341" fill="#25211C" font-size="27">当前线索</text><text x="1344" y="374" fill="#6E6257" font-size="17">CURRENT THREAD</text>
      <text x="1344" y="477" fill="#25211C" font-size="27">一个下一步</text><text x="1344" y="510" fill="#6E6257" font-size="17">ONE NEXT STEP</text>
      <text x="1344" y="613" fill="#25211C" font-size="27">解释性输出</text><text x="1344" y="646" fill="#6E6257" font-size="17">EXPLAINABLE OUTPUT</text>
    </g>
  </g>
  <text x="1498" y="822" text-anchor="end" fill="#8D8175" font-family="Segoe UI, sans-serif" font-size="17">LESS MEMORY, MORE RELEVANCE</text>
</svg>
