version: '3.9'

services:
  margin:
    build: .
    container_name: margin
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - margin-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MARGIN_SURFACE_HOST=0.0.0.0
      - MARGIN_SURFACE_PORT=3000
      - MARGIN_PI_PROVIDER=yapi
      - MARGIN_PI_MODEL=gpt-5.6-terra
      - MARGIN_PI_BASE_URL=https://yapi.click/v1
      - MARGIN_PI_API=openai-responses
      - MARGIN_PI_API_KEY_ENV=YAPI_API_KEY
      - YAPI_API_KEY=${YAPI_API_KEY:-}
      - MARGIN_LOG_LEVEL=info

volumes:
  margin-data:
